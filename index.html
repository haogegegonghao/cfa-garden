<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 26 26%22%3E%3Cpath d=%22M13 24V12%22 stroke=%22%234F8460%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M13 15c-5 0-7-3-7-7 4 0 7 2 7 7z%22 fill=%22%234F8460%22/%3E%3Cpath d=%22M13 12c0-5 3-8 8-8 0 5-3 8-8 8z%22 fill=%22%23C94F72%22/%3E%3C/svg%3E">
<title>CFA 小花园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600&family=Long+Cang&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: a study garden. Sticky header + tab row; each view is one calm column (max 1040px).
   The one bold moment is the Today hero: a big italic countdown beside a handwritten note from him. */
:root{
  --paper:#FBF5F6;      /* blush paper */
  --card:#FFFFFF;
  --ink:#2A2131;        /* plum ink */
  --muted:#76697C;
  --line:#EBDDE2;
  --rose:#C94F72;       /* accent: petals */
  --rose-soft:#F6DCE4;
  --leaf:#4F8460;       /* done / growth */
  --leaf-soft:#DDEBDF;
  --gold:#B8862C;       /* finance gold: flower hearts, milestones */
  --gold-soft:#F5E8CC;
  --soil:#E6D8DC;
  --note:#FFFBEA;       /* the paper of his notes */
  --note-ink:#3B2E22;
  --shadow:0 1px 2px rgba(60,30,50,.06),0 8px 24px rgba(60,30,50,.07);

  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-num:"Fraunces","Iowan Old Style",Georgia,serif;
  --f-body:"Inter",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B161F;--card:#251E2A;--ink:#F2E9EF;--muted:#A99BAD;--line:#3A2F40;
  --rose:#EE7E9E;--rose-soft:#4A2734;--leaf:#83BB93;--leaf-soft:#22362A;--gold:#E2B862;--gold-soft:#3E3220;
  --soil:#3A3040;--note:#2F2A22;--note-ink:#F3E6CF;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B161F;--card:#251E2A;--ink:#F2E9EF;--muted:#A99BAD;--line:#3A2F40;
  --rose:#EE7E9E;--rose-soft:#4A2734;--leaf:#83BB93;--leaf-soft:#22362A;--gold:#E2B862;--gold-soft:#3E3220;
  --soil:#3A3040;--note:#2F2A22;--note-ink:#F3E6CF;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--rose)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.3}
.wrap{max-width:1040px;margin:0 auto}
.en{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.82em;letter-spacing:.01em}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;max-width:1040px;margin:0 auto}
.brand-l{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:20px;font-weight:900;letter-spacing:.02em}
.brand h1 b{font-family:var(--f-num);font-weight:600;font-style:italic;color:var(--rose);margin-right:2px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--soil);display:inline-block}
.sync[data-s="cloud"] i{background:var(--leaf)}
.sync[data-s="local"] i{background:var(--gold)}
nav.tabs{max-width:1040px;margin:8px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:8px 12px 10px;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--rose)}
nav.tabs a .badge{font-size:11px;background:var(--rose);color:var(--paper);border-radius:9px;padding:0 6px;margin-left:4px;vertical-align:1px}

main{padding-top:28px}
section.view{display:flex;flex-direction:column;gap:40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:22px}
.sec-h p{margin:0}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:500;transition:transform .12s,background .12s}
.btn:hover{border-color:var(--rose)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--paper)}
.btn.primary:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip:hover{border-color:var(--rose)}
.chip[aria-pressed="true"]{background:var(--rose-soft);border-color:var(--rose);color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:80px;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}

/* TODAY hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center}
.count .greet{font-family:var(--f-display);font-size:20px}
.count .big{display:flex;align-items:baseline;gap:10px;margin:6px 0 6px}
.count .big b{font-family:var(--f-num);font-style:italic;font-weight:500;font-size:clamp(84px,14vw,148px);line-height:.9;color:var(--rose);letter-spacing:-.03em;font-variation-settings:"opsz" 144}
.count .big span{font-family:var(--f-display);font-size:22px}
.count .sub{color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-num);font-size:30px;font-weight:500;line-height:1.1}
.stat small{color:var(--muted);font-size:12px}
.hbar{height:6px;border-radius:3px;background:var(--soil);overflow:hidden;margin-top:6px;width:160px;max-width:100%}
.hbar i{display:block;height:100%;background:var(--leaf);border-radius:3px}

.note{position:relative;background:var(--note);color:var(--note-ink);padding:28px 26px 22px;border-radius:4px;box-shadow:var(--shadow);transform:rotate(1.2deg)}
.note::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:22px;transform:translateX(-50%) rotate(-3deg);background:var(--rose-soft);opacity:.85;border-radius:2px}
.note .from{font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:600}
.note .txt{font-family:var(--f-hand);font-size:30px;line-height:1.35;margin:10px 0 12px;white-space:pre-wrap;word-break:break-word}
.note .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.note .heart{color:var(--rose);font-size:18px}

/* today: plan + log */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.focus-t{font-family:var(--f-display);font-size:24px;margin:6px 0 4px}
.mods{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:2px}
.mods li label{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:8px;cursor:pointer}
.mods li label:hover{background:var(--paper)}
.mods input{accent-color:var(--leaf);margin-top:5px;flex:none}
.mods li.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--leaf)}
.logrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.log-ok{font-size:13px;color:var(--leaf);min-height:20px;margin-top:8px}

/* garden */
.garden-wrap{overflow-x:auto}
.garden{display:grid;grid-template-columns:52px repeat(7,minmax(30px,44px));gap:4px;justify-content:start;min-width:300px}
.garden .dow{font-size:11px;color:var(--muted);text-align:center}
.garden .mon{font-size:11px;color:var(--muted);align-self:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;display:grid;place-items:center;position:relative}
.cell .soil{width:5px;height:5px;border-radius:50%;background:var(--soil)}
.cell.future .soil{opacity:.45}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--rose)}
.cell.exam{background:var(--gold-soft)}
.cell svg{width:86%;height:86%;overflow:visible}
.cell.pop svg{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.garden-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.garden-legend span{display:inline-flex;align-items:center;gap:4px}
.garden-legend svg{width:18px;height:18px}
.garden-side{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:start}

.miles{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mile{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mile b{font-family:var(--f-num);font-size:20px;font-weight:500}
.mile .st{font-size:12px;color:var(--muted);white-space:nowrap}
.mile.got b{color:var(--gold)}
.mile.got .st{color:var(--gold);font-weight:600}

/* map */
.topic{border-top:1px solid var(--line);padding:14px 0}
.topic:last-child{border-bottom:1px solid var(--line)}
.t-head{display:grid;grid-template-columns:minmax(0,1fr) 120px 150px 24px;gap:16px;align-items:center;cursor:pointer;background:none;border:0;width:100%;text-align:left;padding:0}
.t-name{font-family:var(--f-display);font-size:18px}
.t-name .en{display:block;font-size:12px}
.wbar{font-size:12px;color:var(--muted)}
.wbar .w{height:6px;background:var(--soil);border-radius:3px;position:relative;margin-top:4px}
.wbar .w i{position:absolute;top:0;bottom:0;background:var(--gold);border-radius:3px;opacity:.85}
.pbar .p{height:6px;background:var(--soil);border-radius:3px;margin-top:4px;overflow:hidden}
.pbar .p i{display:block;height:100%;background:var(--leaf)}
.pbar{font-size:12px;color:var(--muted)}
.caret{transition:transform .2s;color:var(--muted);font-size:20px}
.topic.open .caret{transform:rotate(90deg)}
.t-body{display:none;padding:12px 0 4px;gap:14px;flex-direction:column}
.topic.open .t-body{display:flex}
.why{background:var(--rose-soft);border-radius:12px;padding:10px 14px;font-size:14px;max-width:72ch}
.why b{color:var(--rose)}
.conf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mods.cols{columns:2;column-gap:28px;display:block}
.mods.cols li{break-inside:avoid}

/* plan */
.plan-set{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.plan-sum{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.warn{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:14px;max-width:72ch}
.weeks{display:flex;flex-direction:column;margin-top:8px}
.week{display:grid;grid-template-columns:96px minmax(0,1fr) 48px;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.week .wk{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.week .wk b{display:block;color:var(--ink);font-family:var(--f-num);font-size:16px;font-weight:500}
.week .hrs{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.week.now{background:linear-gradient(90deg,var(--rose-soft),transparent 85%);border-radius:10px;padding-left:10px;margin-left:-10px}
.week.past{opacity:.55}
.week .phase{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--leaf);margin-right:8px}
.week .phase.rv{color:var(--gold)}
.week .phase.mk{color:var(--rose)}
.tag{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:13px;margin:2px 4px 2px 0}

/* flashcards */
.fc-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flash{perspective:1200px;max-width:620px;margin:0 auto;width:100%}
.flash-in{position:relative;min-height:290px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .ttag{font-size:12px;color:var(--muted);letter-spacing:.06em}
.face .q{font-family:var(--f-display);font-size:26px;margin:auto 0}
.face .fx{font-family:var(--f-num);font-size:19px;background:var(--paper);border-radius:10px;padding:10px 14px;overflow-x:auto}
.face .tip{font-size:14px;color:var(--muted)}
.face .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:auto}
.fc-act{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.boxes{display:flex;gap:6px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.boxes span{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}

/* quiz */
.qcard{max-width:720px}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.qtext{font-size:17px;margin:0 0 16px;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--rose)}
.opt b{font-family:var(--f-num);font-weight:600}
.opt.right{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:16px;border-left:3px solid var(--leaf);padding:4px 0 4px 14px;max-width:68ch}
.explain.bad{border-left-color:var(--rose)}
.explain p{margin:4px 0}
.qnav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 24px}
.acc div{font-size:13px;display:flex;flex-direction:column;gap:4px}
.acc .p{height:5px;background:var(--soil);border-radius:3px;overflow:hidden}
.acc .p i{display:block;height:100%;background:var(--leaf)}
.result-big{font-family:var(--f-num);font-size:64px;font-style:italic;color:var(--rose);line-height:1;margin:6px 0}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.notes .note{transform:rotate(var(--r,0deg))}
.notes .note .txt{font-size:26px}
.compose{display:flex;flex-direction:column;gap:10px;max-width:640px}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.del:hover{color:var(--rose)}

/* tutor */
.chat{display:flex;flex-direction:column;gap:14px;max-width:760px}
.msg{padding:12px 16px;border-radius:16px;white-space:pre-wrap;word-break:break-word;max-width:92%}
.msg.me{align-self:flex-end;background:var(--rose-soft)}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.err{align-self:flex-start;color:var(--rose);font-size:14px}
.presets{display:flex;gap:8px;flex-wrap:wrap;max-width:760px}
.ask{display:flex;gap:10px;align-items:flex-end;max-width:760px}
.ask textarea{min-height:52px}

.foot{margin-top:56px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;max-width:72ch}

.petal{position:fixed;pointer-events:none;z-index:50;width:14px;height:14px;border-radius:70% 0 70% 0;background:var(--rose);opacity:.9}

@media (max-width:860px){
  .garden-side{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .hero,.two{grid-template-columns:minmax(0,1fr)}
  .note{transform:rotate(.6deg)}
  .t-head{grid-template-columns:minmax(0,1fr) 90px 20px}
  .t-head .wbar{display:none}
  .mods.cols{columns:1}
  .week{grid-template-columns:74px minmax(0,1fr)}
  .week .hrs{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="brand-l">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 24V12" stroke="var(--leaf)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M13 15c-5 0-7-3-7-7 4 0 7 2 7 7z" fill="var(--leaf)"/><path d="M13 12c0-5 3-8 8-8 0 5-3 8-8 8z" fill="var(--rose)"/></svg>
      <h1><b>CFA</b> 小花园</h1>
    </div>
    <div class="sync" id="sync" data-s="none"><i></i><span>正在连接…</span></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面">
    <a href="#today" data-v="today">今天</a>
    <a href="#plan" data-v="plan">学习计划</a>
    <a href="#map" data-v="map">知识地图</a>
    <a href="#cards" data-v="cards">公式闪卡<span class="badge" id="dueBadge" hidden></span></a>
    <a href="#quiz" data-v="quiz">练习题</a>
    <a href="#tutor" data-v="tutor" id="tutorTab" hidden>问助教</a>
    <a href="#notes" data-v="notes">他的留言</a>
  </nav>
</header>

<main class="wrap" id="app"></main>

<script>
/* ============================== CONTENT ============================== */
const TOPICS=[
 {id:'ethics',cn:'道德与职业标准',en:'Ethical and Professional Standards',w:[15,20],conf:1,

function buildPlan(){
  const start=mondayOf(parse(S.startDate)),exam=parse(S.examDate);
  const weeks=Math.max(1,Math.ceil((exam-start+864e5)/(7*864e5)));
  const factor={1:1.3,2:1,3:.7};
  const raw=ORDER.map(id=>{const t=T[id];return{id,v:(t.w[0]+t.w[1])/2*factor[S.conf[id]||2]}});
  const sum=raw.reduce((a,r)=>a+r.v,0);
  const NEED=TARGET_H*.8;
  const reviewMin=weeks>=14?Math.max(4,Math.round(weeks*.22)):Math.max(1,Math.round(weeks*.25));
  const passW=Math.max(1,weeks-reviewMin);
  const cap=passW*S.weeklyHours;
  const scale=Math.min(1,cap/NEED);
  const blocks=raw.map(r=>({id:r.id,h:NEED*r.v/sum*scale}));
  const out=[];let bi=0,left=blocks[0].h;
  for(let w=0;w<weeks;w++){
    const ws=addDays(start,w*7);const item={i:w,start:ws,items:[],phase:'first'};
    if(bi<blocks.length){
      let capW=S.weeklyHours;
      while(capW>.05&&bi<blocks.length){const take=Math.min(capW,left);if(take>.05)item.items.push({id:blocks[bi].id,h:take});capW-=take;left-=take;if(left<=.05){bi++;if(bi<blocks.length)left=blocks[bi].h}}
      out.push(item);continue;
    }
    item.phase=(weeks-w<=2)?'mock':'review';out.push(item);
  }
  const rv=ORDER.slice().sort((a,b)=>(T[b].w[1]*(4-(S.conf[b]||2)))-(T[a].w[1]*(4-(S.conf[a]||2))));
  let k=0;out.filter(x=>x.phase==='review').forEach(x=>{x.items=[{id:rv[k%rv.length]},{id:rv[(k+1)%rv.length]}];k+=2});
  return{weeks:out,total:weeks,firstWeeks:out.filter(x=>x.phase==='first').length,scale,cap,need:NEED};
}
function currentWeek(plan){const t=parse(TODAY());return plan.weeks.find(w=>t>=w.start&&t<addDays(w.start,7))}

  const send=()=>{const v=ta.value.trim();if(v){ta.value='';askTutor(v)}};
  s.append(el('div',{class:'ask'},ta,tutor.busy?el('button',{class:'btn',type:'button',onclick:()=>tutor.ctrl&&tutor.ctrl.abort()},'停止'):el('button',{class:'btn primary',type:'button',onclick:send},'发送')));
  if(tutor.pending){const p=tutor.pending;tutor.pending=null;setTimeout(()=>askTutor(p),0)}
  return s;
};
async function askTutor(text){
  if(tutor.busy||!cloud.sample)return;
  tutor.msgs.push({role:'user',content:text});
  const ai={role:'assistant',content:'正在想…'};
  const hist=tutor.msgs.filter(m=>!m.err).slice(-9).map(m=>({role:m.role,content:m.content}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  hist[0]={role:'user',content:TUTOR_SYS+hist[0].content};
  tutor.msgs.push(ai);tutor.busy=true;render();
  tutor.ctrl=new AbortController();
  try{
    const r=await cloud.sample(hist,{cache:false,signal:tutor.ctrl.signal,onText:({text})=>{ai.content=text;const c=$('#chat');if(c&&c.lastChild)c.lastChild.textContent=text}});
    ai.content=(r&&r.text)||ai.content;
  }catch(e){
    if(e&&e.text){ai.content=e.text}
    else{tutor.msgs.pop();tutor.msgs.push({role:'assistant',err:true,content:e&&e.code==='rate_limited'?'问得有点快，等一分钟再问吧。':e&&e.code==='not_granted'?'助教需要你允许后才能用。':'这次没有回答成功，可以再发一次。'})}
  }
  tutor.busy=false;tutor.ctrl=null;if(view==='tutor')render();
}

/* notes */
views.notes=()=>{
  const s=el('section',{class:'view'});
  s.append(el('div',{class:'sec-h'},el('h2',{text:'他的留言'}),el('p',{class:'muted',text:cloud.isOwner?'写给她的话会贴在「今天」页最上面，最新的一张先出现。':'他写给你的每一张小纸条都在这里。'})));
  if(cloud.isOwner&&cloud.db){
    const ta=el('textarea',{id:'noteText',maxlength:300,placeholder:'今天想对她说点什么？'});
    const msg=el('span',{class:'muted',style:'font-size:13px'});
    const b=el('button',{class:'btn primary',type:'button',onclick:async()=>{
      const v=ta.value.trim();if(!v){msg.textContent='先写点什么吧。';return}
      b.disabled=true;
      try{await cloud.db.collection('notes').add({text:v,at:Date.now()});ta.value='';msg.textContent='贴上去了。'}
      catch(e){msg.textContent=e&&e.code==='quota_exceeded'?'留言太多了，先撕掉几张旧的。':'没有贴成功，稍后再试一次。'}
      b.disabled=false;
    }},'贴一张纸条');
    s.append(el('div',{class:'compose'},el('label',{class:'f',for:'noteText'},'写一张新纸条'),ta,el('div',{class:'logrow'},b,msg)));
  }
  if(cloud.db&&!cloud.notesReady){s.append(el('p',{class:'muted',text:'正在取纸条…'}))}
  else if(!cloud.notes.length){s.append(el('div',{class:'empty'},el('h3',{text:'这里还空着'}),el('p',{text:cloud.isOwner?'写下第一张给她的纸条吧。':'他的第一张纸条，很快就会出现。'})))}
  else{
    const g=el('div',{class:'notes'});
    cloud.notes.forEach((n,i)=>{g.append(el('div',{class:'note',style:`--r:${[-1.4,1,-.6,1.6,-1][i%5]}deg`},el('div',{class:'from',text:'给你'}),el('div',{class:'txt',text:n.text}),el('div',{class:'meta'},el('span',{text:fmtDate(n.at)}),cloud.isOwner?el('button',{class:'del',type:'button',onclick:async()=>{try{await cloud.db.doc('notes/'+n.id).delete()}catch(e){}}},'撕掉'):el('span',{class:'heart',text:'♥'}))))});
    s.append(g);
  }
  if(cloud.isOwner&&cloud.db){
    const cfg=el('div');
    cfg.append(el('div',{class:'sec-h'},el('h3',{text:'只有你能看到的设置'}),el('p',{class:'muted',text:'她的称呼会出现在首页问候里；里程碑奖励可以改成你真的会兑现的事。'})));
    const name=el('input',{type:'text',id:'herName',value:cloud.config.herName||'',placeholder:'比如：宝贝',maxlength:20});
    const grid=el('div',{class:'cfg'},el('label',{class:'f',for:'herName'},'她的称呼',name));
    const inputs={};
    MILES.forEach(h=>{const i=el('input',{type:'text',id:'rw'+h,value:(cloud.config.rewards||{})[h]||'',placeholder:DEFAULT_REWARDS[h],maxlength:40});inputs[h]=i;grid.append(el('label',{class:'f',for:'rw'+h},h+' 小时的奖励',i))});
    const msg=el('span',{class:'muted',style:'font-size:13px'});
    const b=el('button',{class:'btn',type:'button',onclick:async()=>{
      const rewards={};MILES.forEach(h=>{const v=inputs[h].value.trim();if(v)rewards[h]=v});
      b.disabled=true;
      try{await cloud.db.doc('config/site').set({herName:name.value.trim(),rewards});msg.textContent='保存好了。'}catch(e){msg.textContent='没有保存成功，稍后再试。'}
      b.disabled=false;
    }},'保存设置');
    cfg.append(grid,el('div',{class:'logrow',style:'margin-top:12px'},b,msg));
    s.append(cfg);
  }
  return s;
};

/* ============================== RENDER ============================== */
function render(){
  const app=$('#app');
  const y=window.scrollY;
  app.replaceChildren(views[view](),el('div',{class:'foot',html:'科目权重与模块名称参考 CFA Institute 公布的 Level I 课程大纲，以当年官网为准。练习题和闪卡是为这个网站原创的，不是官方题目。学习进度保存在这台设备的浏览器里。<br>为你做的，祝考试顺利 ♥'}));
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.dataset.v===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const due=dueCards('all').length;const b=$('#dueBadge');b.hidden=!due;b.textContent=due;
  window.scrollTo(0,y);
}
function route(){
  const h=location.hash.slice(1);
  const nv=views[h]&&!(h==='tutor'&&!cloud.sample)?h:'today';
  const changed=nv!==view;view=nv;
  if(view==='cards'&&changed){fc.queue=null;fc.flipped=false}
  render();if(changed)window.scrollTo(0,0);
}
addEventListener('hashchange',route);
route();
setSync('local',window.claude&&window.claude.use?'正在连接…':'保存在这台设备上');

/* ============================== NOTES FROM notes.json ============================== */
setSync('local','保存在这台设备上');
fetch('notes.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
  if(!d)return;
  cloud.config={herName:d.herName||'',rewards:d.rewards||{}};
  cloud.notes=(Array.isArray(d.notes)?d.notes:[]).map((n,i)=>({id:'n'+i,text:String(n.text||'').trim(),at:n.date?parse(String(n.date)).getTime():0})).filter(n=>n.text).sort((a,b)=>b.at-a.at);
  render();
}).catch(()=>{});
</script>
